<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc">
  <title id="title">카메라 연결과 종료 수명주기</title>
  <desc id="desc">RTSP 포트 확인부터 프레임 수신과 상태 갱신, 종료 시 녹화 중단과 자원 해제 순서를 나타낸다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#71849c"/></marker>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #172033; }
      .t { font-size: 18px; font-weight: 800; }
      .s { font-size: 13px; fill: #617188; }
      .node { fill: #fff; stroke: #ced9e7; stroke-width: 2; }
      .stop { fill: #e9f2ff; stroke: #9dbbe7; stroke-width: 2; }
      .summary-label { fill: #fff; }
      .line { fill: none; stroke: #71849c; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="560" height="430" rx="22" fill="#f8fafd"/>
  <text x="34" y="33" font-size="12" font-weight="800" letter-spacing="2" fill="#35516f">연결</text>
  <g transform="translate(34 50)"><rect class="node" width="210" height="54" rx="12"/><text class="t" x="105" y="25" text-anchor="middle">RTSP 포트 확인</text><text class="s" x="105" y="43" text-anchor="middle">연결 전 상태 점검</text></g>
  <path class="line" d="M244 77H310"/>
  <g transform="translate(312 50)"><rect class="node" width="214" height="54" rx="12"/><text class="t" x="107" y="25" text-anchor="middle">스트림 연결</text><text class="s" x="107" y="43" text-anchor="middle">카메라 단위 상태 관리</text></g>
  <path class="line" d="M419 104V139"/>
  <g transform="translate(312 141)"><rect class="node" width="214" height="54" rx="12"/><text class="t" x="107" y="25" text-anchor="middle">프레임 수신</text><text class="s" x="107" y="43" text-anchor="middle">정상 · 시간 초과 · 실패</text></g>
  <path class="line" d="M312 168H246"/>
  <g transform="translate(34 141)"><rect class="node" width="210" height="54" rx="12"/><text class="t" x="105" y="25" text-anchor="middle">화면·상태 갱신</text><text class="s" x="105" y="43" text-anchor="middle">재연결 판단 흐름</text></g>
  <path class="line" d="M139 195V224"/>
  <text x="34" y="244" font-size="12" font-weight="800" letter-spacing="2" fill="#35516f">종료</text>
  <g transform="translate(34 260)"><rect class="stop" width="145" height="58" rx="12"/><text class="t" x="72.5" y="26" text-anchor="middle">녹화 중단</text><text class="s" x="72.5" y="45" text-anchor="middle">종료 요청</text></g>
  <path class="line" d="M179 289H205"/>
  <g transform="translate(207 260)"><rect class="stop" width="145" height="58" rx="12"/><text class="t" x="72.5" y="26" text-anchor="middle">스레드 대기</text><text class="s" x="72.5" y="45" text-anchor="middle">수신 · 녹화</text></g>
  <path class="line" d="M352 289H378"/>
  <g transform="translate(380 260)"><rect class="stop" width="146" height="58" rx="12"/><text class="t" x="73" y="26" text-anchor="middle">자원 해제</text><text class="s" x="73" y="45" text-anchor="middle">OpenCV · FFmpeg</text></g>
  <rect x="34" y="350" width="492" height="48" rx="12" fill="#174ca8"/>
  <text class="summary-label" x="280" y="380" text-anchor="middle" font-size="16" font-weight="800">종료 순서를 고정해 사용 중인 통신·미디어 자원을 정리</text>
</svg>
