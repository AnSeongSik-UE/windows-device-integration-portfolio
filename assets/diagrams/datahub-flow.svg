<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
  <title id="title">TunnelROVDataHub 데이터 처리 흐름</title>
  <desc id="desc">GNSS, 소나, 고도계, PLC 입력을 DataHub에서 수신·파싱·변환해 항법·운용 시스템과 로그로 전달한다.</desc>
  <defs>
    <linearGradient id="hub" x1="0" x2="1">
      <stop offset="0" stop-color="#174ca8"/>
      <stop offset="1" stop-color="#2f76e5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#7890ad"/>
    </marker>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #172033; }
      .label { font-size: 16px; font-weight: 700; }
      .sub { font-size: 12px; fill: #607087; }
      .hub-title { font-size: 22px; font-weight: 800; fill: #fff; }
      .hub-sub { font-size: 14px; fill: #dbe9ff; }
      .node { fill: #fff; stroke: #cfdae8; stroke-width: 2; }
      .out { fill: #eff5ff; stroke: #acc4ec; stroke-width: 2; }
      .line { fill: none; stroke: #7890ad; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="330" rx="24" fill="#f8fafd"/>
  <text x="42" y="38" font-size="13" font-weight="800" letter-spacing="2" fill="#35516f">입력</text>
  <text x="445" y="38" font-size="13" font-weight="800" letter-spacing="2" fill="#35516f">처리</text>
  <text x="853" y="38" font-size="13" font-weight="800" letter-spacing="2" fill="#35516f">출력</text>

  <g transform="translate(34 58)">
    <rect class="node" width="220" height="52" rx="11"/>
    <text class="label" x="18" y="23">GNSS · 고도계</text>
    <text class="sub" x="18" y="41">Serial 데이터</text>
  </g>
  <g transform="translate(34 128)">
    <rect class="node" width="220" height="52" rx="11"/>
    <text class="label" x="18" y="23">HNAV · Profiling Sonar</text>
    <text class="sub" x="18" y="41">UDP 데이터</text>
  </g>
  <g transform="translate(34 198)">
    <rect class="node" width="220" height="52" rx="11"/>
    <text class="label" x="18" y="23">CableReel PLC</text>
    <text class="sub" x="18" y="41">FEnet · TCP 데이터</text>
  </g>

  <path class="line" d="M254 84H403"/>
  <path class="line" d="M254 154H403"/>
  <path class="line" d="M254 224H403"/>

  <g transform="translate(405 78)">
    <rect width="300" height="150" rx="20" fill="url(#hub)"/>
    <text class="hub-title" x="150" y="42" text-anchor="middle">TunnelROVDataHub</text>
    <text class="hub-sub" x="150" y="77" text-anchor="middle">비동기 수신 · 패킷 파싱</text>
    <text class="hub-sub" x="150" y="102" text-anchor="middle">내부 형식 변환 · UI 스레드 전환</text>
    <text class="hub-sub" x="150" y="127" text-anchor="middle">장비별 연결 · 상태 · 로그 관리</text>
  </g>

  <path class="line" d="M705 113H850"/>
  <path class="line" d="M705 193H850"/>

  <g transform="translate(852 77)">
    <rect class="out" width="214" height="72" rx="12"/>
    <text class="label" x="107" y="27" text-anchor="middle">항법·운용 시스템</text>
    <text class="sub" x="107" y="50" text-anchor="middle">HNAV · EIVA · QGC</text>
  </g>
  <g transform="translate(852 169)">
    <rect class="out" width="214" height="72" rx="12"/>
    <text class="label" x="107" y="27" text-anchor="middle">화면 · 로그</text>
    <text class="sub" x="107" y="50" text-anchor="middle">장비·날짜별 상태 기록</text>
  </g>
</svg>
