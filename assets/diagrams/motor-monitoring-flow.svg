<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330" role="img" aria-labelledby="title desc">
  <title id="title">Motor Control 상태 확인 흐름</title>
  <desc id="desc">Motor Controller의 상태를 Status Receive Protocol로 수신하고 데이터를 파싱해 RPM, Current, Voltage, Temperature를 Monitoring UI에서 확인한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#71849c"/></marker>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #172033; }
      .heading { font-size: 14px; font-weight: 800; letter-spacing: 2px; fill: #35516f; }
      .label { font-size: 17px; font-weight: 800; }
      .sub { font-size: 12px; fill: #607087; }
      .node { fill: #fff; stroke: #cfd9e6; stroke-width: 2; }
      .process { fill: #e9f2ff; stroke: #9fbce8; stroke-width: 2; }
      .output { fill: #174ca8; stroke: #174ca8; stroke-width: 2; }
      .output-label, .output-sub { fill: #fff; }
      .line { fill: none; stroke: #71849c; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="480" height="330" rx="22" fill="#f8fafd"/>
  <text class="heading" x="28" y="32">MONITORING FLOW</text>
  <g transform="translate(32 50)"><rect class="node" width="416" height="56" rx="11"/><text class="label" x="208" y="23" text-anchor="middle">Motor Controller</text><text class="sub" x="208" y="43" text-anchor="middle">Motor 1 / Motor 2</text></g>
  <path class="line" d="M240 107V122"/>
  <g transform="translate(32 126)"><rect class="process" width="416" height="54" rx="11"/><text class="label" x="208" y="23" text-anchor="middle">Status Receive Protocol</text><text class="sub" x="208" y="42" text-anchor="middle">수신 데이터 파싱</text></g>
  <path class="line" d="M240 181V195"/>
  <g transform="translate(32 199)"><rect class="node" width="416" height="56" rx="11"/><text class="label" x="208" y="22" text-anchor="middle">RPM · Current</text><text class="label" x="208" y="44" text-anchor="middle">Voltage · Temperature</text></g>
  <path class="line" d="M240 256V270"/>
  <g transform="translate(32 274)"><rect class="output" width="416" height="49" rx="11"/><text class="label output-label" x="208" y="21" text-anchor="middle">Monitoring UI</text><text class="sub output-sub" x="208" y="39" text-anchor="middle">실시간 상태 확인</text></g>
</svg>
