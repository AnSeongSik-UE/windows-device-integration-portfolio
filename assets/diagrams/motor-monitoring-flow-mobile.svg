<svg xmlns="http://www.w3.org/2000/svg" width="330" height="380" viewBox="0 0 330 380" role="img" aria-labelledby="title desc">
  <title id="title">Motor Control 상태 확인 흐름</title>
  <desc id="desc">Motor Controller의 상태를 Status Receive Protocol로 수신하고 데이터를 파싱해 RPM, Current, Voltage, Temperature를 Monitoring UI에서 확인한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7890ad"/></marker>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #172033; }
      .heading { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; fill: #35516f; }
      .label { font-size: 18px; font-weight: 800; }
      .sub { font-size: 13px; fill: #607087; }
      .node { fill: #fff; stroke: #cfdae8; stroke-width: 2; }
      .focus { fill: #eff5ff; stroke: #acc4ec; stroke-width: 2; }
      .line { fill: none; stroke: #7890ad; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="330" height="380" rx="18" fill="#f8fafd"/>
  <text class="heading" x="22" y="32">MONITORING FLOW</text>
  <g transform="translate(22 55)"><rect class="node" width="286" height="60" rx="10"/><text class="label" x="143" y="26" text-anchor="middle">Motor Controller</text><text class="sub" x="143" y="47" text-anchor="middle">Motor 1 / Motor 2</text></g>
  <path class="line" d="M165 116V131"/>
  <g transform="translate(22 135)"><rect class="focus" width="286" height="60" rx="10"/><text class="label" x="143" y="26" text-anchor="middle">Status Receive Protocol</text><text class="sub" x="143" y="47" text-anchor="middle">수신 데이터 파싱</text></g>
  <path class="line" d="M165 196V211"/>
  <g transform="translate(22 215)"><rect class="node" width="286" height="70" rx="10"/><text class="label" x="143" y="29" text-anchor="middle">RPM · Current</text><text class="label" x="143" y="53" text-anchor="middle">Voltage · Temperature</text></g>
  <path class="line" d="M165 286V301"/>
  <g transform="translate(22 305)"><rect class="node" width="286" height="60" rx="10"/><text class="label" x="143" y="26" text-anchor="middle">Monitoring UI</text><text class="sub" x="143" y="47" text-anchor="middle">실시간 상태 확인</text></g>
</svg>
